<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişisel Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sol köşe fotoğrafı için buraya ekleyebilirsin -->
    <img src="mini.png" alt="Profil" class="sol-kose-foto">

    <header>
        <h1>Kişisel Blog</h1>
        <nav>
            <a href="#anasayfa">Ana Sayfa</a>
            <a href="#yazilar">Yazılar</a>
            <a href="#resimler">Resimler</a>
            <a href="#iletisim">İletişim</a>
        </nav>
    </header>

    <!-- Ana İçerik -->
    <main>

        <!-- 1. ANA SAYFA -->
        <div id="anasayfa" class="content-box">
            <h2>Merhabalarrrr</h2>
        </div>

        <!-- 2. YAZILAR (YAZI EKLEME FORMU) -->
        <div id="yazilar" class="content-box">
            <h2>Yeni Yazı Paneli</h2>
            <time>İçerik Giriş Ekranı</time>

            <div id="basari" class="success-message">Yazınız başarıyla kaydedildi!</div>

            <form action="#basari" method="get">
                <div class="form-group">
                    <label for="baslikInput">Yazı Başlığı:</label>
                    <input type="text" id="baslikInput" name="baslik" placeholder="Yazının başlığını girin..." required>
                </div>

                <div class="form-group">
                    <label for="icerikInput">Yazı İçeriği:</label>
                    <textarea id="icerikInput" name="icerik" rows="5" placeholder="Yazınızı buraya yazın..." required></textarea>
                </div>

                <button type="submit">Yayınla</button>
            </form>
        </div>

    </main>

</body>
</html>
